<form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><fieldset><legend>Fechas del embarazo</legend><label>FUM — Fecha de última menstruación<input name="fum" type="date" max="{{ date.today().isoformat() }}" value="{{ embarazo.fum.isoformat() if embarazo and embarazo.fum else '' }}"></label><small>Primer día de la última menstruación.</small><label>FPP — Fecha probable de parto<input name="fpp" type="date" value="{{ embarazo.fpp.isoformat() if embarazo and embarazo.fpp else '' }}"></label><small>Fecha estimada; puede ajustarse con orientación profesional.</small></fieldset><fieldset><legend>Método de estimación</legend><select name="metodo_fpp"><option value="">No especificado</option>{% for valor, texto in [('fum','Fecha de última menstruación'),('ecografia','Ecografía'),('profesional','Profesional'),('otro','Otro')] %}<option value="{{ valor }}" {% if embarazo and embarazo.metodo_fpp == valor %}selected{% endif %}>{{ texto }}</option>{% endfor %}</select></fieldset><button type="submit">{{ 'Guardar cambios' if editar else 'Guardar embarazo' }}</button></form>
