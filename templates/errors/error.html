{% extends 'layouts/base.html' %}
{% block title %}{{ titulo }} | Aurora{% endblock %}
{% block content %}
<main id="main" tabindex="-1" class="app-shell error-page">
  <span class="material-symbols-outlined error-page__icon" aria-hidden="true">{{ icono }}</span>
  <p class="eyebrow">{{ eyebrow }}</p>
  <h1>{{ titulo }}</h1>
  <p>{{ mensaje }}</p>
  <a class="button button--primary button--wide" href="{{ url_for('main.index') if current_user.is_authenticated else url_for('auth.login') }}">Volver a Aurora</a>
  {% if reintentar %}<a class="button button--secondary button--wide" href="{{ request.path }}" style="margin-top:8px;">Reintentar</a>{% endif %}
</main>
{% endblock %}
