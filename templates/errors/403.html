{% extends 'layouts/base.html' %}
{% block title %}Acceso denegado | Aurora{% endblock %}
{% block content %}
<main class="app-shell error-page">
  <span class="material-symbols-outlined error-page__icon" aria-hidden="true">lock</span>
  <p class="eyebrow">Error 403</p>
  <h1>Acceso denegado</h1>
  <p>No tienes permisos para consultar este espacio.</p>
  <a class="button button--primary button--wide" href="{{ url_for('main.index') if current_user.is_authenticated else url_for('auth.login') }}">Volver a Aurora</a>
</main>
{% endblock %}
