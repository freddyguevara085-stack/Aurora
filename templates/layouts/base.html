<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#43215f">
    <meta name="description" content="Acompañamiento prenatal Aurora">
    <link rel="manifest" href="{{ url_for('main.manifest') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>{% block title %}Aurora{% endblock %}</title>
</head>
<body>
    {% block content %}{% endblock %}
    {% if current_user.is_authenticated and current_user.rol and current_user.rol.nombre == 'usuario' %}
        {% include 'partials/bottom_nav.html' %}
    {% endif %}
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
