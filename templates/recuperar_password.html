{% extends 'layouts/base.html' %}
{% block title %}Recuperar contraseña | Aurora{% endblock %}
{% block content %}
<main id="main" tabindex="-1" class="app-shell login-shell">
  <section class="login-hero" aria-labelledby="recuperar-title">
    <img src="{{ url_for('static', filename='icons/app-icon-192.png') }}" width="80" height="80" alt="Aurora">
    <p class="login-brand">Aurora</p>
    <h1 id="recuperar-title">Recupera tu contraseña</h1>
    <p>Ingresa tu correo y te enviaremos un enlace.</p>
  </section>
  {% include 'partials/flash.html' %}
  <form class="login-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Correo electrónico<input id="email" name="email" type="email" autocomplete="email" placeholder="tu@correo.com" required></label>
    <button class="button button--primary button--wide" type="submit">Generar enlace</button>
    <p class="form-note"><a href="{{ url_for('auth.login') }}">Volver a iniciar sesión</a></p>
  </form>
</main>
{% endblock %}
