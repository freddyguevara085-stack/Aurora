{% extends 'layouts/base.html' %}
{% block title %}Restablecer contraseña | Aurora{% endblock %}
{% block content %}
<main id="main" tabindex="-1" class="app-shell login-shell">
  <section class="login-hero" aria-labelledby="restablecer-title">
    <img src="{{ url_for('static', filename='icons/app-icon-192.png') }}" width="80" height="80" alt="Aurora">
    <p class="login-brand">Aurora</p>
    <h1 id="restablecer-title">Nueva contraseña</h1>
    <p>Define una contraseña de al menos 8 caracteres.</p>
  </section>
  {% include 'partials/flash.html' %}
  <form class="login-card" method="post" action="{{ url_for('auth.restablecer_password', token=token) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="password">Nueva contraseña<input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></label>
    <label for="password_confirm">Confirmar contraseña<input id="password_confirm" name="password_confirm" type="password" minlength="8" autocomplete="new-password" required></label>
    <button class="button button--primary button--wide" type="submit">Guardar nueva contraseña</button>
    <p class="form-note"><a href="{{ url_for('auth.login') }}">Volver a iniciar sesión</a></p>
  </form>
</main>
{% endblock %}
