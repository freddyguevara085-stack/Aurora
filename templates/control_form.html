{% extends 'layouts/base.html' %}{% block title %}Registrar control | Aurora{% endblock %}{% block content %}<main class="app-shell"><a class="back" href="{{ url_for('main.controles') }}">Mis controles</a><h1>Registrar control</h1>{% include 'partials/flash.html' %}<form class="card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Número de control <input name="numero_control" type="number" min="1" required></label><label>Fecha <input name="fecha_control" type="date" required></label><label>Centro <select name="centro_atencion_id"><option value="">Sin especificar</option>{% for centro in centros %}<option value="{{ centro.id }}">{{ centro.nombre }}</option>{% endfor %}</select></label><label>Edad gestacional <input name="edad_gestacional" type="number" min="0" max="45" step="0.1"></label><label>Estado <select name="estado"><option value="programado">Programado</option><option value="realizado">Realizado</option><option value="reprogramado">Reprogramado</option><option value="cancelado">Cancelado</option></select></label><label>Indicaciones <textarea name="indicaciones"></textarea></label><button class="button button--primary button--wide">Guardar control</button></form></main>{% endblock %}
